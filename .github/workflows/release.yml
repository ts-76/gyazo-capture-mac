name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build Ad Hoc signed DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./script/build_release.sh "$VERSION" "$GITHUB_RUN_NUMBER"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/GyazoCapture-*.dmg \
            dist/GyazoCapture-*.dmg.sha256 \
            --generate-notes
